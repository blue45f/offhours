packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  prisma: true
  '@prisma/engines': true
  '@nestjs/core': true
  argon2: true
  esbuild: true
  '@scarf/scarf': false
  msw: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lucide-react@1.17.0
  - zustand@5.0.14
  - '@heejun/prettier-config@3.0.0'
  - '@heejun/eslint-config@4.0.0'
overrides:
  electron-to-chromium: 1.5.362
  enhanced-resolve: 5.22.0
